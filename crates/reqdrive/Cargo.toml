[package]
name = "reqdrive"
version = "0.4.0"
edition = "2021"
description = "reqdrive story harness: runs one work order to a pushed commit"
license = "MIT"

[lib]
name = "reqdrive"
path = "src/lib.rs"

[[bin]]
name = "reqdrive"
path = "src/main.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
