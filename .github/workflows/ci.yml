name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint bin/
        run: shellcheck bin/reqdrive

      - name: Lint lib/
        run: shellcheck lib/*.sh

      - name: Lint install.sh
        run: shellcheck install.sh

      - name: Lint test scripts
        run: shellcheck tests/simple-test.sh tests/run-tests.sh tests/mutate.sh tests/spec-map.sh tests/oracle-gate.sh tests/gate-selftest.sh tests/lib/pipeline-harness.sh

  syntax-check:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check bin/reqdrive
        run: bash -n bin/reqdrive

      - name: Syntax check lib/*.sh
        run: for f in lib/*.sh; do bash -n "$f"; done

      - name: Syntax check install.sh
        run: bash -n install.sh

  test-simple:
    name: Tests (simple runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run simple test suite
        run: bash tests/simple-test.sh

  test-bats:
    name: Tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get install -y bats

      - name: Run unit tests
        run: bats --formatter tap tests/unit/

      - name: Run E2E tests
        run: bats --formatter tap tests/e2e/

      - name: Fail on any e2e skip
        run: |
          skips=$(bats --formatter tap tests/e2e | grep -c '# skip' || true)
          echo "e2e skips: $skips"
          [ "$skips" -eq 0 ]

  oracle-gate:
    name: Freeze gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the frozen oracle
        run: bash tests/oracle-gate.sh

      - name: Prove the gate rules fire
        run: bash tests/gate-selftest.sh
